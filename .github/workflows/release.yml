name: Release

# Собирает три образа и кладёт в GHCR. Деплой отсюда НЕ делается:
# apps живёт за домашним NAT, снаружи доступен только 443 у фронт-двери,
# достучаться внутрь GitHub не может. Поэтому схема pull-based — на apps
# таймер сам забирает свежий образ (см. deploy/README.md).
#
# Self-hosted runner намеренно не используется: репозиторий публичный,
# а значит любой pull request исполнил бы свой код внутри домашней сети.

# Два потока из одного workflow — шаги сборки одинаковые:
#
#   push в main  → образы :main и :sha-xxxxxxx     (препрод, только из меша)
#   тег vX.Y.Z   → образы :X.Y.Z, :latest, :sha-…  (прод, repobuddy.space)
#
# `latest` двигается ТОЛЬКО по тегу. docker-compose.prod.yml по умолчанию
# смотрит на latest, поэтому прод обновляется осознанно — когда поставлен
# тег, а не когда смержен PR.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Не собираем образы, пока не прошли typecheck, тесты и продакшен-сборки.
  # ci.yml висит на том же push в main, но GitHub не связывает workflow между
  # собой — поэтому ждём его явно.
  #
  # Только для веток. На теге ci.yml не запускается вовсе (он висит на push
  # в main и на PR), и ожидание провисело бы до таймаута. Тег ставится с
  # main, куда красное не попадает из-за защиты ветки, так что проверка
  # уже пройдена этим же коммитом.
  wait-for-ci:
    name: ждём CI
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'typecheck + unit'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'integration'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  build:
    name: ${{ matrix.name }}
    needs: wait-for-ci
    # wait-for-ci пропускается на тегах, а пропущенная зависимость по
    # умолчанию отменяет и зависящий job — поэтому разрешаем оба исхода
    # явно. Провалившийся CI по-прежнему останавливает сборку.
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.wait-for-ci.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # api и worker собираются из одного Dockerfile разными целями —
          # слои общие, кэш переиспользуется.
          - name: api
            dockerfile: apps/api/Dockerfile
            target: runner-api
          - name: worker
            dockerfile: apps/api/Dockerfile
            target: runner-worker
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runner-web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          # main          — препрод, обновляется на каждый мерж
          # 0.1.0 / 0.1   — версия релиза
          # latest        — прод; двигается ТОЛЬКО по тегу
          # sha-xxxxxxx   — неподвижный, им откатываемся
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш слоёв между прогонами: pnpm install и нативные модули
          # (tree-sitter, sharp) пересобираются только при смене манифестов.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
