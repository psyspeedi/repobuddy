name: Release

# Собирает три образа и кладёт в GHCR. Деплой отсюда НЕ делается:
# apps живёт за домашним NAT, снаружи доступен только 443 у фронт-двери,
# достучаться внутрь GitHub не может. Поэтому схема pull-based — на apps
# таймер сам забирает свежий образ (см. deploy/README.md).
#
# Self-hosted runner намеренно не используется: репозиторий публичный,
# а значит любой pull request исполнил бы свой код внутри домашней сети.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Не собираем образы, пока не прошли typecheck, тесты и продакшен-сборки.
  # ci.yml висит на том же push в main, но GitHub не связывает workflow между
  # собой — поэтому ждём его явно.
  wait-for-ci:
    name: ждём CI
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'typecheck + unit'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'integration'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  build:
    name: ${{ matrix.name }}
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # api и worker собираются из одного Dockerfile разными целями —
          # слои общие, кэш переиспользуется.
          - name: api
            dockerfile: apps/api/Dockerfile
            target: runner-api
          - name: worker
            dockerfile: apps/api/Dockerfile
            target: runner-worker
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runner-web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          # latest — на что смотрит деплой по умолчанию.
          # sha-xxxxxxx — неподвижный тег, им же и откатываемся.
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш слоёв между прогонами: pnpm install и нативные модули
          # (tree-sitter, sharp) пересобираются только при смене манифестов.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
