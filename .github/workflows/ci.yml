name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-unit:
    name: typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nuxt prepare (generates apps/web/.nuxt for typecheck)
        run: pnpm --filter @repobuddy/web exec nuxt prepare

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

      - name: API unit tests
        run: pnpm --filter @repobuddy/api test test/unit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Typecheck does not exercise the Nuxt production build, so
      # build-only failures reached the deploy unseen — an unescaped `@`
      # in a locale file is a hard error for the i18n message compiler
      # but perfectly valid TypeScript.
      - name: Web production build
        run: pnpm --filter @repobuddy/web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The prod containers run compiled JS (node dist/main.js), so a
      # broken nest/swc build is a deploy blocker CI must catch. shared
      # builds first because the api build's #shared alias resolves to it.
      - name: API production build
        run: pnpm --filter @repobuddy/shared build && pnpm --filter @repobuddy/api build

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: typecheck-unit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repobuddy
          POSTGRES_PASSWORD: repobuddy
          POSTGRES_DB: repobuddy_test
        ports:
          - 5532:5432
        options: >-
          --health-cmd "pg_isready -U repobuddy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6479:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://repobuddy:repobuddy@localhost:5532/repobuddy_test
      REDIS_URL: redis://localhost:6479
      OPENAI_API_KEY: sk-test-dummy
      CODEGRAPH_MOCK_PROVIDERS: '1'
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      NUXT_SESSION_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @repobuddy/api db:migrate

      - name: API integration tests
        run: pnpm --filter @repobuddy/api test test/integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
