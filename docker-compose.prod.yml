services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repobuddy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repobuddy-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner-api
    container_name: repobuddy-api
    restart: always
    environment:
      PROCESS_ROLE: web
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?required}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      APP_URL: ${APP_URL:?required}
      WEB_ORIGIN: ${WEB_ORIGIN:?required}
      API_URL: ${API_URL:-}
      # Only needed for a split-origin deployment (API on its own
      # domain): the MCP endpoint validates the Host header against
      # these URLs, and behind the bundled Caddy APP_URL already covers
      # it. Optional so the same-origin default keeps working unset.
      API_BASE_URL: ${API_BASE_URL:-}
      API_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3001"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner-worker
    container_name: repobuddy-worker
    restart: always
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner-web
    container_name: repobuddy-web
    restart: always
    environment:
      NUXT_PUBLIC_APP_URL: ${APP_URL:?required}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:?required}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: repobuddy-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
