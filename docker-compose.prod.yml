services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repobuddy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repobuddy-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  # Одноразовый прогон миграций перед стартом приложения.
  #
  # Почему отдельным сервисом, а не в entrypoint у api: api и worker
  # поднимаются одновременно и мигрировали бы параллельно. Drizzle обещает
  # идемпотентность (применённое пропускается), но про одновременный запуск
  # двух процессов не говорит ничего — гонка на CREATE TABLE даст грязное
  # падение. Здесь мигрирует ровно один контейнер, и пока он не завершится
  # успешно, api и worker не стартуют.
  #
  # Если миграция упала — приложение не поднимется, а прежние контейнеры
  # продолжат работать на старом образе. Это лучше, чем новый код против
  # старой схемы.
  migrate:
    image: ghcr.io/psyspeedi/repobuddy-api:${IMAGE_TAG:-latest}
    container_name: repobuddy-migrate
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # image + build вместе: на сервере деплой делает `pull` и берёт готовый
    # образ из GHCR, локально `docker compose build` собирает то же самое.
    # IMAGE_TAG — рычаг отката: поставить sha-xxxxxxx вместо latest.
    image: ghcr.io/psyspeedi/repobuddy-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner-api
    container_name: repobuddy-api
    restart: always
    environment:
      PROCESS_ROLE: web
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Not :?required — env.ts accepts either OPENAI_API_KEY or
      # LLM_API_KEY (the documented Groq/OpenRouter path) and validates
      # the pair itself, with a clearer message than compose can give.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?required}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      APP_URL: ${APP_URL:?required}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Behind the bundled Caddy everything is one origin, so this may
      # stay unset — main.ts falls back to http://localhost:3000.
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      API_URL: ${API_URL:-}
      # Only needed for a split-origin deployment (API on its own
      # domain): the MCP endpoint validates the Host header against
      # these URLs, and behind the bundled Caddy APP_URL already covers
      # it. Optional so the same-origin default keeps working unset.
      API_BASE_URL: ${API_BASE_URL:-}
      API_PORT: 3001
      # Operational levers documented in README "Deployment notes".
      # Without these the container only ever sees env.ts defaults and
      # anything the operator sets in .env is silently ignored.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      COST_BUDGET_USD_PER_DAY: ${COST_BUDGET_USD_PER_DAY:-3}
      LLM_BUDGET_USD_PER_INDEX: ${LLM_BUDGET_USD_PER_INDEX:-2.0}
      MAX_FILES_PER_INDEX: ${MAX_FILES_PER_INDEX:-2000}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-200}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"

  worker:
    image: ghcr.io/psyspeedi/repobuddy-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner-worker
    container_name: repobuddy-worker
    restart: always
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      # EnvSchema is shared between roles, so the worker must satisfy the
      # same required fields as the API even though it serves no OAuth
      # and holds no sessions. Without these it dies on bootstrap.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?required}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?required}
      APP_URL: ${APP_URL:?required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
      COST_BUDGET_USD_PER_DAY: ${COST_BUDGET_USD_PER_DAY:-3}
      LLM_BUDGET_USD_PER_INDEX: ${LLM_BUDGET_USD_PER_INDEX:-2.0}
      MAX_FILES_PER_INDEX: ${MAX_FILES_PER_INDEX:-2000}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-200}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/psyspeedi/repobuddy-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner-web
    container_name: repobuddy-web
    restart: always
    environment:
      NUXT_PUBLIC_APP_URL: ${APP_URL:?required}
      # Empty = same-origin relative calls, which is what the bundled
      # Caddy serves. Marking it required contradicted the api service
      # above, where the same variable is explicitly optional.
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: repobuddy-caddy
    restart: always
    # Caddyfile line 1 is `{$APP_DOMAIN} {`. Without this the
    # substitution is empty, Caddy reads a bare `{` as the global
    # options block and dies on `unrecognized global option: encode`.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
