# Single-node Loki for local development. Default-ish settings;
# tweak retention via storage_config / limits_config for production.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki
  # Loki 3.x moved chunks_directory / rules_directory under
  # common.storage.filesystem (previously they sat under
  # storage_config.filesystem, which now only accepts `directory`).
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false
  # Drop logs older than 30 days. max_query_lookback gates the UI from
  # asking for data the compactor has already pruned.
  retention_period: 720h
  max_query_lookback: 720h

compactor:
  working_directory: /loki/compactor
  # Retention is processed by the compactor on its own schedule (every
  # compaction_interval, default 10m). `delete_request_store` is
  # required whenever retention_enabled is true — for the filesystem
  # backend we point it at the local store.
  retention_enabled: true
  delete_request_store: filesystem
